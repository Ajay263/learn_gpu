# News Intelligence Platform — CPU-side infrastructure (Environments 1, 2, 4).
# Run through the Makefile (`make up`), which passes --env-file .env and the project name.
#
# Every published port binds to 127.0.0.1. In Codespaces, use port forwarding (private by default).
# Never make these ports public — they include admin interfaces.

name: newsintel

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Shared definition for API / worker / MCP (same image, different command).
x-app: &app
  image: newsintel-app:${APP_IMAGE_TAG:-dev}
  build: { context: ../../services }
  profiles: ["app"]
  env_file: ["../../.env"]
  environment:
    POSTGRES_HOST: postgres
    RABBITMQ_HOST: rabbitmq
    S3_ENDPOINT_URL: http://minio:9000
    OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/newsintel}
    OIDC_JWKS_URL: http://keycloak:8080/realms/newsintel/protocol/openid-connect/certs
    PIXELTABLE_HOME: /var/lib/pixeltable
  volumes: ["pixeltable-cache:/var/lib/pixeltable"]
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    minio: { condition: service_healthy }
  deploy: { resources: { limits: { memory: 1g } } }
  logging: *default-logging
  restart: unless-stopped

services:
  # ───────────── Environment 1: ingestion & object storage ─────────────
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }
    logging: *default-logging
    restart: unless-stopped

  # One-shot: buckets, versioning, least-privilege service users. Idempotent.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    entrypoint: ["bash", "/init/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SFTPGO_ACCESS_KEY: ${MINIO_SFTPGO_ACCESS_KEY:?set in .env}
      MINIO_SFTPGO_SECRET_KEY: ${MINIO_SFTPGO_SECRET_KEY:?set in .env}
      MINIO_NIFI_ACCESS_KEY: ${MINIO_NIFI_ACCESS_KEY:?set in .env}
      MINIO_NIFI_SECRET_KEY: ${MINIO_NIFI_SECRET_KEY:?set in .env}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set in .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set in .env}
    volumes: ["../minio:/init:ro"]
    depends_on: { minio: { condition: service_healthy } }
    restart: "no"

  sftpgo:
    image: drakkan/sftpgo:v2.7.6-alpine
    environment:
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "true"
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USER:?set in .env}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:?set in .env}
      SFTPGO_SFTPD__BINDINGS__0__PORT: "2022"
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
      SFTPGO_TELEMETRY__BIND_PORT: "10000"
      SFTPGO_TELEMETRY__BIND_ADDRESS: "0.0.0.0"
      # Password-based admin only from loopback-bound port; FTP/WebDAV stay disabled (default).
    volumes: [sftpgo-data:/var/lib/sftpgo, sftpgo-home:/srv/sftpgo]
    ports: ["127.0.0.1:2022:2022", "127.0.0.1:8090:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:10000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 256m } } }
    logging: *default-logging
    restart: unless-stopped

  # One-shot: creates the uploader account whose filesystem is the MinIO `landing` bucket.
  sftpgo-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z   # reused only for bash + curl
    entrypoint: ["bash", "/init/sftpgo-init.sh"]
    environment:
      SFTPGO_URL: http://sftpgo:8080
      SFTPGO_ADMIN_USER: ${SFTPGO_ADMIN_USER}
      SFTPGO_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD}
      SFTPGO_UPLOADER_USER: ${SFTPGO_UPLOADER_USER:?set in .env}
      SFTPGO_UPLOADER_PASSWORD: ${SFTPGO_UPLOADER_PASSWORD:?set in .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1073741824}
      MINIO_SFTPGO_ACCESS_KEY: ${MINIO_SFTPGO_ACCESS_KEY}
      MINIO_SFTPGO_SECRET_KEY: ${MINIO_SFTPGO_SECRET_KEY}
    volumes: ["../sftpgo:/init:ro"]
    depends_on:
      sftpgo: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: "no"

  nifi:
    image: apache/nifi:2.12.0
    # Stable hostname: NiFi's generated TLS cert (kept in nifi-conf) is issued for it.
    hostname: nifi
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_ADMIN_USER:?set in .env}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_ADMIN_PASSWORD:?set in .env (min 12 chars)}
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_PROXY_HOST: "localhost:8443,127.0.0.1:8443,nifi:8443"
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_PROPS_KEY:?set in .env (min 12 chars)}
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      - nifi-content:/opt/nifi/nifi-current/content_repository
      - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi-database:/opt/nifi/nifi-current/database_repository
    ports: ["127.0.0.1:8443:8443"]
    healthcheck:
      # NiFi binds to its hostname (not loopback), and the TLS cert is issued for it.
      test: ["CMD-SHELL", "curl -ksf -o /dev/null https://nifi:8443/nifi/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    deploy: { resources: { limits: { memory: 1600m } } }
    logging: *default-logging
    restart: unless-stopped

  # ───────────── Shared state: Postgres (Pixeltable catalog, Keycloak, app) ─────────────
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      PIXELTABLE_DB_PASSWORD: ${PIXELTABLE_DB_PASSWORD:?set in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 768m } } }
    logging: *default-logging
    restart: unless-stopped

  # ───────────── Environment 4: orchestration plumbing ─────────────
  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }
    logging: *default-logging
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: ["auth", "app"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    volumes: ["../keycloak:/opt/keycloak/data/import:ro"]
    ports: ["127.0.0.1:8081:8080"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      # Keycloak image has no curl; the management port (9000) serves /health/ready.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy: { resources: { limits: { memory: 900m } } }
    logging: *default-logging
    restart: unless-stopped

  # ───────────── Environment 4: application (one image, several roles) ─────────────
  api:
    <<: *app
    command: ["newsintel-api", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    <<: *app
    command: ["newsintel-worker"]
    deploy: { resources: { limits: { memory: 1500m } } }

  # Deterministic stand-in for the GPU inference API (no model weights). For dev/CI without Kaggle.
  inference-fake:
    image: newsintel-app:${APP_IMAGE_TAG:-dev}
    profiles: ["fake-inference"]
    command: ["newsintel-inference", "--host", "0.0.0.0", "--port", "9100"]
    environment:
      INFERENCE_API_KEY: ${AI_INFERENCE_API_KEY}
      INFERENCE_BACKEND: fake
      EMBED_TEXT_DIM: ${EMBED_TEXT_DIM:-1024}
      EMBED_IMAGE_DIM: ${EMBED_IMAGE_DIM:-768}
      FAKE_ASR_SCRIPT: ${FAKE_ASR_SCRIPT:-}
    volumes: ["../../tests/fixtures:/fixtures:ro"]
    ports: ["127.0.0.1:9100:9100"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9100/livez"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

volumes:
  pixeltable-cache:
  minio-data:
  sftpgo-data:
  sftpgo-home:
  nifi-conf:
  nifi-state:
  nifi-content:
  nifi-flowfile:
  nifi-provenance:
  nifi-database:
  postgres-data:
  rabbitmq-data:
