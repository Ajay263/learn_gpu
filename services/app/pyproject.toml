[project]
name = "newsintel"
version = "0.1.0"
description = "Multimodal News Intelligence Platform — API, worker and MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "structlog>=25.1",
    "boto3>=1.38",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pika>=1.3.2",
    "pixeltable==0.7.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "fastmcp>=2.12",
    "pyjwt[crypto]>=2.10",
    "scenedetect>=0.7.2",
    "opencv-python-headless>=4.11",
    "pillow>=11.0",
    "prometheus-client>=0.22",
    "openai>=1.90",
]

[project.scripts]
newsintel-api = "newsintel.api.main:run"
newsintel-worker = "newsintel.worker.main:run"
newsintel-mcp = "newsintel.mcp.server:run"
newsintel-admin = "newsintel.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "paramiko>=3.5",
    "ruff>=0.12",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsintel"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the docker compose stack (make up-core)",
    "gpu: needs a live inference endpoint",
]
addopts = "-m 'not integration and not gpu'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
