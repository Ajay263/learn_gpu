[project]
name = "newsintel-inference"
version = "0.1.0"
description = "Inference gateway + API contract for the News Intelligence Platform"
requires-python = ">=3.10"
# Base install = contract + gateway + fake backend. Light enough for the app to depend on.
dependencies = [
    "pydantic>=2.11,<3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Installed only on the GPU host (Kaggle / on-prem). Versions pinned in requirements-gpu.txt.
gpu = []

[project.scripts]
newsintel-inference = "newsintel_inference.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsintel_inference"]
